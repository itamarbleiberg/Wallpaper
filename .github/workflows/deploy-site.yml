name: Deploy website

on:
  push:
    branches: ["main", "feature/aquawall-app"]
    paths: ["web/**", "src/engine/**", "src/shared/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build site
        working-directory: web
        env:
          # Served from https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: SPA/base fallback
        working-directory: web
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically on the first run where possible.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
